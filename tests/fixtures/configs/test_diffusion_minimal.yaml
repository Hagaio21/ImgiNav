experiment:
  name: "test_diffusion"
  phase: "diffusion_training"
  save_path: "tests/outputs/test_diffusion"

dataset:
  manifest: "tests/fixtures/test_manifest.csv"
  outputs:
    latent: "latent_path"
  filters:
    is_empty: [false]
  return_path: false

autoencoder:
  encoder:
    in_channels: 3
    latent_channels: 4
    base_channels: 16
    downsampling_steps: 2
    activation: SiLU
    norm_groups: 4
    variational: false
  
  decoder:
    latent_channels: 4
    base_channels: 16
    upsampling_steps: 2
    activation: SiLU
    norm_groups: 4
    heads:
      - type: RGBHead
        name: rgb
        out_channels: 3
        final_activation: tanh
  frozen: true

latent_clamp_min: -6.0
latent_clamp_max: 6.0
scale_factor: 1.0

embedding_projection:
  type: EmbeddingToSpatial
  output_channels: 16
  spatial_size: [16, 16]
  combine_method: concat
  text_dim: 384
  pov_dim: 512

unet:
  type: UnetWithAttention
  in_channels: 4
  out_channels: 4
  base_channels: 16
  depth: 2
  num_res_blocks: 1
  time_dim: 128
  norm_groups: 4
  dropout: 0.0
  use_attention: true
  attention_heads: 1
  attention_at:
    - bottleneck
  enable_cross_attention: true
  use_ema: false

scheduler:
  type: LinearScheduler
  num_steps: 100

training:
  seed: 42
  train_split: 0.8
  batch_size: 2
  num_workers: 0
  shuffle: true
  epochs: 1
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.01
  use_amp: false
  loss:
    type: MSELoss
    key: pred_noise
    target: noise
    weight: 1.0

