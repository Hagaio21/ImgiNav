# =============================================================================
# Diffusion Training Config Template
# =============================================================================
# This template is used by generate_diffusion_configs.py to create all experiment configs
# Placeholders: {VARIANT}, {SCOPE}, {CONDITIONING}, {ARCH_SIZE}, {EXPERIMENT_NAME}
# =============================================================================

experiment:
  name: {EXPERIMENT_NAME}
  phase: diffusion_training
  save_path: {SAVE_PATH}

dataset:
  manifest: {MANIFEST_PATH}
  outputs:
    latent: layout_latent_path
{EMBEDDING_OUTPUTS}
  filters:
{TYPE_FILTER}
    rejected: false
  return_path: false

autoencoder:
  checkpoint: {VAE_CHECKPOINT}
  frozen: true

latent_clamp_min: -6.0
latent_clamp_max: 6.0
scale_factor: 1.0

embedding_projection:
  type: CLIPEmbeddingToSpatial
  output_channels: {BASE_CHANNELS}
  spatial_size:
  - 16
  - 16
  combine_method: average
  _clip_projections_embedded: true

unet:
  type: UnetWithAttention
  in_channels: 4
  out_channels: 4
  base_channels: {BASE_CHANNELS}
  depth: {DEPTH}
  num_res_blocks: 2
  time_dim: 256
  norm_groups: 8
  dropout: 0.1
  use_attention: true
  attention_heads: {ATTENTION_HEADS}
  attention_at:
  - downs
  - bottleneck
  enable_cross_attention: true
  use_ema: false

scheduler:
  type: LinearScheduler
  num_steps: 1000

training:
  seed: 4242
  train_split: 0.8
  batch_size: {BATCH_SIZE}
  num_workers: 4
  shuffle: true
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.01
  save_interval: 20
  eval_interval: 10
  sample_interval: 10
  use_amp: true
  max_grad_norm: 0.5
  gradient_accumulation_steps: 1
  scheduler:
    type: cosine
  cfg_dropout_rate: 0.15
  guidance_scale: 5.0
  sampling_seed_base: 42
  num_conditioned_samples_per_type: 8
  loss:
    type: MSELoss
    key: pred_noise
    target: noise
    weight: 1.0
