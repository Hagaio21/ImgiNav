experiment:
  name: diff_clip_regular_rooms_small_down_bottleneck_text_only
  phase: diffusion_training
  save_path: /work3/s233249/ImgiNav/experiments/clip/diff_clip_regular_rooms_small_down_bottleneck_text_only
  epochs_target: 1000
dataset:
  manifest: /work3/s233249/ImgiNav/experiments/shared_embeddings/manifest_with_embeddings.csv
  outputs:
    latent: layout_latent_path
    text_emb: graph_embedding_path
  filters:
    type:
    - room
    rejected: false
  return_path: false
autoencoder:
  checkpoint: C:\Users\Hagai.LAPTOP-QAG9263N\Desktop\Thesis\repositories\ImgiNav\checkpoints\vae_checkpoint_best.pt
  frozen: true
latent_clamp_min: -6.0
latent_clamp_max: 6.0
scale_factor: 1.0
embedding_projection:
  type: CLIPEmbeddingToSpatial
  output_channels: 48
  spatial_size:
  - 32
  - 32
  combine_method: average
  _clip_projections_embedded: true
unet:
  type: UnetWithAttention
  in_channels: 4
  out_channels: 4
  base_channels: 48
  depth: 3
  num_res_blocks: 2
  time_dim: 256
  norm_groups: 8
  dropout: 0.1
  use_attention: true
  attention_heads: 2
  attention_at:
  - downs
  - bottleneck
  enable_cross_attention: true
  use_ema: false
scheduler:
  type: LinearScheduler
  num_steps: 1000
training:
  seed: 2024
  train_split: 0.8
  batch_size: 64
  num_workers: 4
  shuffle: true
  epochs: 1000
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.01
  save_interval: 20
  eval_interval: 10
  sample_interval: 10
  use_amp: true
  max_grad_norm: 0.5
  gradient_accumulation_steps: 1
  scheduler:
    type: cosine
  cfg_dropout_rate: 0.1
  guidance_scale: 5.0
  loss:
    type: MSELoss
    key: pred_noise
    target: noise
    weight: 1.0
