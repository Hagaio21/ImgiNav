# =============================================================================
# Experiment 3: Standalone CLIP Projection Training
# =============================================================================
# Trains a CLIP projection to map:
# - Textured and segmented POV embeddings
# - Graph embeddings
# to segmented layout latents.
#
# The layout latents are pre-encoded using a trained VAE (run encode_layouts.py first).
# Only the CLIP projection is trained (not the VAE).
# =============================================================================

experiment:
  name: "clip_projection_experiment3"
  phase: "clip_projection_training"
  save_path: "outputs/clip_projections/experiment3"

# =============================================================================
# Dataset
# =============================================================================
# NOTE: Layout latents must be pre-encoded using encode_layouts.py
# The script will automatically add layout_latent_path column to the manifest.
# =============================================================================
dataset:
  manifest: "dataset_v2/manifests/manifest_seg.csv"  # Use seg manifest (for segmented layouts)
  dataset_root: "dataset_v2"  # Dataset root directory
  
  # The script will automatically use:
  # - pov_embedding_path: POV embeddings (can be from seg or tex manifest)
  # - graph_embedding_path: Graph embeddings (same for both)
  # - layout_latent_path: Pre-encoded layout latents (added by script)

# =============================================================================
# CLIP Projection
# =============================================================================
clip_projection:
  projection_dim: 256
  text_dim: 384      # all-MiniLM-L6-v2 (graph embeddings)
  pov_dim: 512       # ResNet18 (POV embeddings)
  # latent_dim will be inferred automatically from sample latents
  spatial_alignment: false  # Use global alignment (default)

# =============================================================================
# Training
# =============================================================================
training:
  seed: 42
  epochs: 100
  batch_size: 64
  num_workers: 8
  
  # Split
  train_split: 0.8
  split_seed: 42
  
  # Optimizer
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.01
  
  # Scheduler
  scheduler:
    type: cosine
  
  # Checkpointing
  save_interval: 5
  eval_interval: 1
  early_stopping_patience: 15
  early_stopping_min_delta: 0.00005
  
  use_amp: true

# =============================================================================
# Loss
# =============================================================================
loss:
  type: CLIPLoss
  key: "latent_features"      # Key in preds for layout latents
  text_key: "text_emb"        # Key in targets for graph embeddings
  pov_key: "pov_emb"          # Key in targets for POV embeddings
  temperature: 0.07           # Temperature for contrastive loss
  weight: 1.0                 # Loss weight
  combine_method: "average"    # How to combine text and POV: "add", "concat", "average"

# =============================================================================
# Validation
# =============================================================================
validation:
  batch_size: 64

