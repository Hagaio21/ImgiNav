experiment:
  name: diff_clip_seg_rooms_small_down_bottleneck_graph_32x32x8
  phase: diffusion_training
  save_path: /work3/s233249/ImgiNav/experiments/diffusion/diff_clip_seg_rooms_small_down_bottleneck_graph_32x32x8
dataset:
  manifest: /work3/s233249/ImgiNav/dataset_v2/manifests/vae_seg_256_clip_32x32x8_latent_manifest_seg_with_rejections.csv
  outputs:
    latent: layout_latent_path
    text_emb: graph_embedding_path
  filters:
    type:
    - room
    rejected: false
  return_path: false
autoencoder:
  checkpoint: /work3/s233249/ImgiNav/experiments/v2/autoencoders/vae_seg_256_clip_32x32x8/checkpoints/vae_seg_256_clip_32x32x8_checkpoint_best.pt
  frozen: true
latent_clamp_min: -3.233157
latent_clamp_max: 3.712635
scale_factor: 1.830329
embedding_projection:
  type: CLIPEmbeddingToSpatial
  clip_projections: /work3/s233249/ImgiNav/experiments/v2/autoencoders/vae_seg_256_clip_32x32x8/checkpoints/vae_seg_256_clip_32x32x8_clip_projection_best.pt
  output_channels: 48
  spatial_size:
  - 32
  - 32
  combine_method: average
unet:
  type: UnetWithAttention
  in_channels: 8
  out_channels: 8
  base_channels: 48
  depth: 3
  num_res_blocks: 2
  time_dim: 256
  norm_groups: 8
  dropout: 0.1
  use_attention: true
  attention_heads: 2
  attention_at:
  - downs
  - bottleneck
  enable_cross_attention: true
  use_ema: false
scheduler:
  type: LinearScheduler
  num_steps: 1000
training:
  seed: 4242
  train_split: 0.8
  batch_size: 48
  num_workers: 4
  shuffle: true
  epochs: 300
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.01
  save_interval: 20
  eval_interval: 10
  sample_interval: 10
  use_amp: true
  max_grad_norm: 0.5
  gradient_accumulation_steps: 1
  scheduler:
    type: cosine
  cfg_dropout_rate: 0.15
  guidance_scale: 5.0
  use_precomputed_weights: true
  precomputed_weight_column: sample_weight
  sampling_seed_base: 42
  num_conditioned_samples_per_type: 8
  loss:
    type: MSELoss
    key: pred_noise
    target: noise
    weight: 1.0

