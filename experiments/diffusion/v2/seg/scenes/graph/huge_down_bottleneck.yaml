experiment:
  name: diff_clip_seg_scenes_huge_down_bottleneck_graph
  phase: diffusion_training
  save_path: /work3/s233249/ImgiNav/experiments/diffusion/diff_clip_seg_scenes_huge_down_bottleneck_graph
dataset:
  manifest: /work3/s233249/ImgiNav/dataset_v2/manifests/vae_seg_256_clip_latent_manifest_seg_with_rejections.csv
  outputs:
    latent: layout_latent_path
    text_emb: graph_embedding_path
  filters:
    type:
    - scene
    rejected: false
  return_path: false
autoencoder:
  checkpoint: /work3/s233249/ImgiNav/experiments/v2/autoencoders/vae_seg_256_clip/checkpoints/vae_seg_256_clip_checkpoint_best.pt
  frozen: true
latent_clamp_min: -3.233157
latent_clamp_max: 3.712635
scale_factor: 1.830329
embedding_projection:
  type: CLIPEmbeddingToSpatial
  clip_projections: /work3/s233249/ImgiNav/experiments/v2/autoencoders/vae_seg_256_clip/checkpoints/vae_seg_256_clip_clip_projection_best.pt
  output_channels: 256
  spatial_size:
  - 16
  - 16
  combine_method: average
unet:
  type: UnetWithAttention
  in_channels: 4
  out_channels: 4
  base_channels: 256
  depth: 4
  num_res_blocks: 3
  time_dim: 512
  norm_groups: 16
  dropout: 0.1
  use_attention: true
  attention_heads: 16
  attention_at:
  - downs
  - bottleneck
  enable_cross_attention: true
  window_size: 16  # Window size for windowed attention (16x16 windows for 32x32 latents). Set to null for full attention.
  use_ema: false
scheduler:
  type: LinearScheduler
  num_steps: 1000
training:
  seed: 4242
  epochs: 500
  train_split: 0.8
  batch_size: 16  # Reduced batch size for larger model
  num_workers: 4
  shuffle: true
  learning_rate: 0.0001
  optimizer: AdamW
  weight_decay: 0.01
  save_interval: 20
  eval_interval: 10
  sample_interval: 10
  use_amp: true
  max_grad_norm: 0.5
  gradient_accumulation_steps: 2  # Increased to maintain effective batch size
  scheduler:
    type: cosine
  cfg_dropout_rate: 0.25
  guidance_scale: 7.0
  sampling_seed_base: 42
  # Number of samples to generate per condition during evaluation
  # For single-type experiments: generates this many samples for each selected condition
  # For "both" experiments: selects this many conditions per type, then generates this many samples per condition
  num_conditioned_samples_per_type: 8
  loss:
    type: MSELoss
    key: pred_noise
    target: noise
    weight: 1.0

