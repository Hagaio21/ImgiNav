# =============================================================================
# VAE Training Config - Segmented Layouts (256x256)
# =============================================================================
# Symmetric encoder/decoder with residual blocks
# All parameters explicitly defined (no defaults)
# =============================================================================

experiment:
  name: "vae_seg_256_clip"
  phase: "clip_vae_training"
  save_path: "/work3/s233249/ImgiNav/experiments/v2/autoencoders/vae_seg_256_clip"

# =============================================================================
# Dataset
# =============================================================================
dataset:
  manifest: "/work3/s233249/ImgiNav/dataset_v2/manifests/manifest_seg.csv"
  
  outputs:
    rgb: "layout_path"
    text_emb: "graph_embedding_path"
    pov_emb: "pov_embedding_path"
  
  transform:
    type: Compose
    transforms:
      - type: Resize
        size: [256, 256]
        interpolation: nearest
      - type: ToTensor
      - type: Normalize
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]

# =============================================================================
# Autoencoder
# =============================================================================
autoencoder:
  encoder:
    in_channels: 3
    latent_channels: 4
    base_channels: 64
    channel_multipliers: [1, 2, 4]
    num_res_blocks: 2
    norm_groups: 8
    dropout: 0.0
  
  decoder:
    latent_channels: 4
    base_channels: 64
    channel_multipliers: [4, 2, 1]
    num_res_blocks: 2
    norm_groups: 8
    dropout: 0.0
    heads:
      - type: RGBHead
        name: rgb
        out_channels: 3
        final_activation: tanh
  
  clip_projection:
    type: CLIPProjections
    projection_dim: 256
    text_dim: 384
    pov_dim: 512

# =============================================================================
# Training
# =============================================================================
training:
  seed: 42
  epochs: 150
  batch_size: 96
  num_workers: 8
  
  use_precomputed_weights: true
  precomputed_weight_column: "sample_weight"
  max_weight: 10.0
  
  train_split: 0.8
  split_seed: 42
  
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.02
  
  save_interval: 5
  sample_interval: 5
  early_stopping_patience: 10
  early_stopping_min_delta: 0.00005
  early_stopping_restore_best: true
  
  use_amp: true
  
  loss:
    type: CompositeLoss
    losses:
      - type: L1Loss
        key: rgb
        target_key: rgb
        weight: 1.0
      
      - type: KLDLoss
        weight: 0.0001
      
      - type: LatentStandardizationLoss
        key: mu
        weight: 0.1
        mean_penalty_type: l2
        std_penalty_type: l2
        per_channel: true
      
      - type: CLIPLoss
        key: latent_features
        text_key: text_emb
        pov_key: pov_emb
        temperature: 0.07
        weight: 0.2
        projection_dim: 256
        text_dim: 384
        pov_dim: 512
        combine_method: average
        use_model_projections: true