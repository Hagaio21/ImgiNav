# =============================================================================
# VAE Training Config - Textured Layouts (256x256) - 32x32x16 Latents
# =============================================================================
# Lightweight symmetric encoder/decoder 
# Latent shape: 32x32x16 (16 channels)
# ~2.1M parameters total + VGG for perceptual loss
# =============================================================================

experiment:
  name: "vae_tex_256_clip_32x32x16"
  phase: "clip_vae_training"
  save_path: "/work3/s233249/ImgiNav/experiments/v2/autoencoders/vae_tex_256_clip_32x32x16"

# =============================================================================
# Dataset
# =============================================================================
dataset:
  manifest: "/work3/s233249/ImgiNav/dataset_v2/manifests/manifest_tex.csv"
  
  outputs:
    rgb: "layout_path"
    text_emb: "graph_embedding_path"
    pov_emb: "pov_embedding_path"
  
  transform:
    type: Compose
    transforms:
      - type: Resize
        size: [256, 256]
        interpolation: bilinear   # Smooth interpolation for textures
      - type: ToTensor
      - type: Normalize
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]

# =============================================================================
# Autoencoder
# =============================================================================
autoencoder:
  encoder:
    in_channels: 3
    base_channels: 64
    downsampling_steps: 3         # 256 → 128 → 64 → 32
    latent_channels: 16           # 32x32x16 latent space
    norm_groups: 8
    activation: SiLU
    channel_dropout: 0.1           # Channel dropout rate for regularization
  
  decoder:
    latent_channels: 16           # 32x32x16 latent space
    base_channels: 64
    upsampling_steps: 3           # 32 → 64 → 128 → 256
    norm_groups: 8
    activation: SiLU
    heads:
      - type: RGBHead
        name: rgb
        out_channels: 3
        final_activation: tanh
  
  clip_projection:
    type: CLIPProjections
    projection_dim: 256
    text_dim: 384
    pov_dim: 512

# =============================================================================
# Training
# =============================================================================
training:
  seed: 42
  epochs: 150
  batch_size: 96                  # Slightly smaller due to VGG for perceptual loss
  num_workers: 8
  
  use_precomputed_weights: true
  precomputed_weight_column: "sample_weight"
  max_weight: 10.0
  # Multiply weights for non-empty rooms to give them more emphasis
  non_empty_multiplier: 2.0
  # Print weight statistics grouped by is_empty and type
  weight_stats_columns: ["is_empty", "type"]
  
  train_split: 0.8
  split_seed: 42
  
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.02
  
  save_interval: 5
  sample_interval: 5
  early_stopping_patience: 15
  early_stopping_min_delta: 0.00005
  early_stopping_restore_best: true
  
  use_amp: true
  
  loss:
    type: CompositeLoss
    losses:
      - type: L1Loss
        key: rgb
        target_key: rgb
        weight: 1.0
      
      - type: GradientDifferenceLoss
        key: rgb
        target_key: rgb
        weight: 0.5
      
      - type: PerceptualLoss
        key: rgb
        target_key: rgb
        weight: 0.1
        layers: ["conv1_2", "conv2_2", "conv3_3"]
      
      - type: KLDLoss
        weight: 0.00005
      
      - type: LatentStandardizationLoss
        key: mu
        weight: 0.1
        mean_penalty_type: l2
        std_penalty_type: l2
        per_channel: true
      
      - type: CLIPLoss
        key: latent_features
        text_key: text_emb
        pov_key: pov_emb
        temperature: 0.07
        weight: 0.2
        projection_dim: 256
        text_dim: 384
        pov_dim: 512
        combine_method: average
        use_model_projections: true
